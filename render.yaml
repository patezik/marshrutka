# Render Blueprint: один веб-сервис (игра + API). База — внешний PostgreSQL (Neon/Supabase/Render Postgres).
services:
  - type: web
    name: marshrutka
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
