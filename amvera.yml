# Конфигурация для Amvera Cloud (https://docs.amvera.ru)
# Сборка: npm install && npm run build; запуск: npm start на порту 3001.
# База данных берётся из переменной/секрета DATABASE_URL (задаётся в разделе «Переменные»).
meta:
  environment: node
  toolchain:
    name: npm
    version: 22

build:
  additionalCommands: npm run build

run:
  command: npm start
  containerPort: 3001
